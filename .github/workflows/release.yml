# Publish wheels and sdists to PyPI on version tags.
#
# ONE-TIME SETUP (PyPI trusted publishing):
#   1. On https://pypi.org/manage/account/publishing/, add a pending publisher:
#      owner gmhoward9289-ops, repo pytest-mcp-contract, workflow release.yml,
#      environment `pypi`.
#   2. Create a GitHub Environment named `pypi` on this repo (unprotected is fine).
#   3. Push tag v0.1.1 (or later). PyPI creates the project on first upload.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test before build
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
          pytest -q

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build

      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          code_version=$(python -c 'from mcp_contract import __version__; print(__version__)')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$code_version" != "$tag_version" ]; then
            echo "::error::tag $tag_version != __version__ $code_version" >&2
            exit 1
          fi
        env:
          PYTHONPATH: src

      - name: Verify the built package installs
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          wheel=$(ls dist/*.whl)
          /tmp/v/bin/pip install --quiet "${wheel}[mcp]"
          /tmp/v/bin/python -c 'from mcp_contract import __version__; print(__version__)'

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
